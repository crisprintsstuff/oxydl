[package]
name = "install_oxydl"
version = "0.1.0"
edition = "2021"
description = "Native Windows Setup Wizard and Installer for OxyDL"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
flate2 = "1.0"
rfd = "0.15"
directories = "5.0"
mslnk = "0.1"
open = "5.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
