[workspace]
members = [
    "crates/installer",
]

[package]
name = "oxydl"
version = "0.1.0"
edition = "2021"
description = "Open source, high-speed multi-part download manager written in pure Rust"
authors = ["OxyDL Contributors"]

[dependencies]
# GUI
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"

# Async Runtime & Networking
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"

# Serialization & State
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
urlencoding = "2.1"
rfd = "0.15"
open = "5.3"
arboard = "3.4"
directories = "5.0"
uuid = { version = "1.10", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
